app = "bitacora-app"
primary_region = "dfw"

[build]

[env]
  PORT = "4000"
  DATABASE_URL = "file:/data/dev.db"
  UPLOAD_DIR = "/data/uploads"
  CORS_ORIGIN = "https://bitacora-app.fly.dev"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
